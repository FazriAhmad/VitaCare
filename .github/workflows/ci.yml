name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vitacare-api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vitecare
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vitecare
      JWT_SECRET: ci-test-secret-not-for-production
      ENCRYPTION_KEY: b6TTDypk7fA4s29cP25n1Gtu3qUJzatU3xvW75c7c3I=
      PORT: 4010
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: vitacare-api/package-lock.json
      - run: npm ci
      - run: npx prisma db push
      - run: npm run seed
      - run: npx tsc -p tsconfig.json --noEmit
      - run: npx tsc -p tsconfig.test.json --noEmit
      - run: npm test

      - name: Ensure pg_dump/pg_restore are available
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Backup & restore (proves the PRD Fase 7 "restore terbukti berhasil" gate, not just the script existing)
        run: |
          npm run backup
          npm run restore:check

      - name: Build & smoke-test the production artifact (not just the dev/tsx-watch path)
        run: |
          npm run build
          node dist/index.js &
          for i in $(seq 1 15); do curl -sf http://localhost:4010/api/health && break || sleep 1; done
          curl -sf http://localhost:4010/api/health | grep -q '"db":"tersambung"'
          kill %1

  frontend:
    name: Frontend (typecheck + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
